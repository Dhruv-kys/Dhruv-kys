  <path d="M183 0 C228 116, 164 212, 235 420 H132 C146 302, 108 214, 152 103 C164 74, 173 37, 183 0 Z" fill="url(#curtain)" opacity="0.95"/>
  <path d="M1122 0 C1067 112, 1126 213, 1050 420 H1200 V0 Z" fill="url(#curtain)"/>
