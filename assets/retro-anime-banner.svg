<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Retro anime night city banner</title>
  <desc id="desc">A retro anime inspired night scene with a window, city skyline, pink curtains, stars, and a silhouetted engineer.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060414"/>
      <stop offset="0.48" stop-color="#081a57"/>
      <stop offset="1" stop-color="#071024"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071224"/>
      <stop offset="0.4" stop-color="#0b46a8"/>
      <stop offset="1" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7bd5"/>
      <stop offset="0.45" stop-color="#c84dff"/>
      <stop offset="1" stop-color="#34114f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2d5d"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <rect y="0" width="8" height="1" fill="#ffffff" opacity="0.06"/>
      <rect y="4" width="8" height="1" fill="#000000" opacity="0.14"/>
    </pattern>
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff8de1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#050711"/>
  <rect x="66" y="28" width="1068" height="320" rx="0" fill="url(#sky)" stroke="#2cecff" stroke-width="3"/>
  <rect x="66" y="232" width="1068" height="116" fill="url(#water)" opacity="0.88"/>

  <g opacity="0.95">
    <circle cx="181" cy="76" r="2" fill="#d7f7ff"/>
