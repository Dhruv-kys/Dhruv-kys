    <circle cx="342" cy="63" r="2" fill="#fff2ff"/>
    <circle cx="506" cy="97" r="1.5" fill="#d7f7ff"/>
    <circle cx="611" cy="57" r="2.4" fill="#fff2ff"/>
    <circle cx="758" cy="119" r="1.8" fill="#d7f7ff"/>
    <circle cx="891" cy="73" r="1.5" fill="#fff2ff"/>
