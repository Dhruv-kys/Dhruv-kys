  <rect x="66" y="348" width="1068" height="72" fill="url(#floor)"/>
  <g stroke="#1cc9ff" opacity="0.7">
    <path d="M66 372 H1134"/>
    <path d="M66 400 H1134"/>
    <path d="M202 348 L142 420"/>
    <path d="M391 348 L350 420"/>
    <path d="M815 348 L860 420"/>
    <path d="M1001 348 L1084 420"/>
